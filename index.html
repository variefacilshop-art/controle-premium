<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle Premium</title>
<style>
body{font-family:Arial;background:#0b1225;color:#fff;margin:0;padding:20px}
.card{background:#111;border-radius:16px;padding:20px;max-width:800px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center}
.btn{padding:8px 14px;border-radius:10px;border:none;cursor:pointer}
.btn-danger{background:#ef4444;color:#fff}
.list-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #333}
.actions{margin-left:auto}
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <h2>Movimentações</h2>
    <button class="btn btn-danger">Excluir selecionados</button>
  </div>

  <div class="list-item">
    <input type="checkbox">
    <span>Exemplo lançamento</span>
    <div class="actions">R$ 100,00</div>
  </div>

  <div class="list-item">
    <input type="checkbox">
    <span>Outro lançamento</span>
    <div class="actions">R$ -50,00</div>
  </div>
</div>

</body>
</html>
