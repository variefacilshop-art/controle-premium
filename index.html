<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Premium</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg,#081a33,#0b2d57);
  color:white;
  text-align:center;
}

.container{
  max-width:420px;
  margin:60px auto;
  padding:20px;
  background: rgba(0,0,0,0.25);
  border-radius:16px;
  box-shadow:0 0 20px rgba(0,0,0,0.3);
}

button{
  background:#1e88ff;
  border:none;
  color:white;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  margin:6px;
  font-weight:bold;
}

button:hover{
  background:#42a5ff;
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:none;
}

.hidden{display:none;}
</style>
</head>

<body>

<div id="loginBox" class="container">
  <h2>🔷 Controle Premium</h2>
  <button onclick="login()">Entrar com Google</button>
</div>

<div id="app" class="container hidden">
  <h3 id="userEmail"></h3>

  <div>
    <button onclick="mostrar('financas')">Finanças</button>
    <button onclick="mostrar('metas')">Metas</button>
    <button onclick="mostrar('dashboard')">Dashboard</button>
  </div>

  <div id="financas" class="hidden">
    <h3>Lançamentos</h3>
    <input id="descricao" placeholder="Descrição">
    <input id="valor" placeholder="Valor (use negativo para saída)">
    <input id="mes" placeholder="Mês (ex: 02/2026)">
    <button onclick="salvar()">Salvar</button>
    <div id="lista"></div>
  </div>

  <div id="metas" class="hidden">
    <h3>Meta Mensal</h3>
    <input id="metaValor" placeholder="Valor da meta">
    <button onclick="salvarMeta()">Salvar Meta</button>
    <p id="metaAtual"></p>
  </div>

  <div id="dashboard" class="hidden">
    <h3>Resumo</h3>
    <p id="totalEntrada"></p>
    <p id="totalSaidas"></p>
    <p id="saldo"></p>
  </div>

  <button style="background:#ff4d4d" onclick="logout()">Sair</button>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://SEU-PROJETO.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzbmFiZnp3ZnZjbXdrZ2lidmVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwNTE1MjcsImV4cCI6MjA4NTYyNzUyN30.s02EFB4FRopxB7Ak7zWUSkINcGY5ESRn7SLbDXn0Wbo"
);

async function login(){
  await supabase.auth.signInWithOAuth({ provider: 'google' });
}

async function logout(){
  await supabase.auth.signOut();
  location.reload();
}

function mostrar(sec){
  document.querySelectorAll('#app > div').forEach(d=>d.classList.add('hidden'));
  document.getElementById(sec).classList.remove('hidden');
}

async function salvar(){
  const { data: { user } } = await supabase.auth.getUser();
  const descricao = descricaoInput.value;
  const valor = parseFloat(valorInput.value);
  const mes = mesInput.value;

  await supabase.from('lancamentos').insert([{
    user_id:user.id, descricao, valor, mes
  }]);

  carregar();
}

async function salvarMeta(){
  const valor = document.getElementById("metaValor").value;
  localStorage.setItem("meta", valor);
  document.getElementById("metaAtual").innerText="Meta: R$ "+valor;
}

async function carregar(){
  const { data: { user } } = await supabase.auth.getUser();

  const { data } = await supabase
    .from('lancamentos')
    .select('*')
    .eq('user_id', user.id);

  const lista = document.getElementById("lista");
  lista.innerHTML="";

  let entradas=0;
  let saidas=0;

  data.forEach(l=>{
    lista.innerHTML += `<p>${l.descricao} — R$ ${l.valor}</p>`;
    if(l.valor>0) entradas+=l.valor;
    else saidas+=l.valor;
  });

  document.getElementById("totalEntrada").innerText="Entradas: R$ "+entradas;
  document.getElementById("totalSaidas").innerText="Saídas: R$ "+saidas;
  document.getElementById("saldo").innerText="Saldo: R$ "+(entradas+saidas);
}

async function iniciar(){
  const { data } = await supabase.auth.getSession();

  if(data.session){
    loginBox.classList.add("hidden");
    app.classList.remove("hidden");
    userEmail.innerText=data.session.user.email;
    carregar();

    const meta = localStorage.getItem("meta");
    if(meta) document.getElementById("metaAtual").innerText="Meta: R$ "+meta;
  }
}

iniciar();
</script>
</body>
</html>
