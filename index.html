<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Premium</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#07142a,#0d2f5a);
  color:#fff;
}

.card{
  max-width:420px;
  margin:120px auto;
  padding:30px;
  background:#0d1f3f;
  border-radius:16px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,0,0,.4);
}

button{
  padding:12px 22px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.google{
  background:#19c2ff;
  color:#000;
}

.logout{
  background:#ff4d4d;
  color:#fff;
  margin-top:15px;
}
</style>
</head>
<body>

<div id="app"></div>

<script>
const SUPABASE_URL = "https://ssnabfzvwfcmwkgibvec.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzbmFiZnp3ZnZjbXdrZ2lidmVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwNTE1MjcsImV4cCI6MjA4NTYyNzUyN30.s02EFB4FRopxB7Ak7zWUSkINcGY5ESRn7SLbDXn0Wbo";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login(){
  await supabase.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin
    }
  });
}

async function logout(){
  await supabase.auth.signOut();
  location.reload();
}

async function init(){

  const { data } = await supabase.auth.getSession();
  const session = data.session;

  // remove token da URL
  if(location.hash.includes("access_token")){
    history.replaceState({}, document.title, "/");
  }

  if(!session){
    renderLogin();
  }else{
    renderSistema(session.user);
  }
}

function renderLogin(){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>💎 Controle Premium</h2>
      <p>Entrar com Google</p>
      <button class="google" onclick="login()">Entrar com Google</button>
    </div>
  `;
}

function renderSistema(user){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>Bem-vindo</h2>
      <p>${user.email}</p>
      <p>Login realizado com sucesso ✅</p>
      <button class="logout" onclick="logout()">Sair</button>
    </div>
  `;
}

init();
</script>

</body>
</html>
