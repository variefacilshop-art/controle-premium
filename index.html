<!DOCTYPE html>

<head>

<title>Controle Premium</title>
<style>
body{font-family:Arial;background:#f4f7fb;margin:0;padding:40px}

.meta-bar{height:18px;background:#e6f2f3;border-radius:20px;overflow:hidden}
.meta-fill{height:100%;width:66%;background:linear-gradient(90deg,#1ec6c6,#1aa39a)}
</style>
</head>
<body>

<h2>Relatório Financeiro</h2>

<div class="card">
<strong>Entradas:</strong> R$ 2.000,00<br>
<strong>Saídas:</strong> R$ 100,00<br>
<strong>Saldo:</strong> R$ 1.900,00
</div>

<div class="card">
Meta do mês
<div class="meta-bar">
<div class="meta-fill"></div>
</div>
<p>66,7% da meta</p>
</div>

</body>
</html>
