<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popup Categorias</title>
<style>
body{font-family:Arial;background:#0b1225;color:#fff;margin:0;height:100vh;display:flex;align-items:center;justify-content:center}
button{padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:bold}
.overlay{
position:fixed;inset:0;background:rgba(0,0,0,.6);
display:none;align-items:center;justify-content:center;
}
.popup{
background:#0f172a;
border:1px solid rgba(255,255,255,.1);
border-radius:14px;
padding:20px;
width:320px;
box-shadow:0 20px 60px rgba(0,0,0,.6);
animation:fade .2s ease;
}
@keyframes fade{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.icon{cursor:pointer;margin-left:8px}
input{width:100%;padding:8px;border-radius:8px;border:none;margin-top:8px}
</style>
</head>
<body>

<button onclick="openPopup()">Gerenciar categorias</button>

<div class="overlay" id="overlay">
  <div class="popup">
    <h3>Categorias</h3>
    <div class="row">Vendas <span>✏️ 🗑</span></div>
    <div class="row">Fornecedor <span>✏️ 🗑</span></div>
    <div class="row">Embalagem <span>✏️ 🗑</span></div>

    <input placeholder="Nova categoria">
    <button style="margin-top:10px;width:100%">➕ Adicionar</button>
  </div>
</div>

<script>
function openPopup(){
 document.getElementById('overlay').style.display='flex'
}
document.getElementById('overlay').onclick=(e)=>{
 if(e.target.id==='overlay') e.target.style.display='none'
}
</script>

</body>
</html>
