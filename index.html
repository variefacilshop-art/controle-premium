<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Premium</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#0b1225;color:#fff}
.center{display:flex;height:100vh;align-items:center;justify-content:center}
.card{background:#111a33;padding:30px;border-radius:12px;width:320px;text-align:center}
button{padding:12px 18px;border:none;border-radius:8px;background:#00c2ff;font-weight:bold;cursor:pointer}
.topbar{position:fixed;top:0;left:0;right:0;background:#111a33;padding:12px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:10px;margin-top:70px;justify-content:center}
.tab{padding:10px 18px;background:#16244a;border-radius:8px}
</style>
</head>
<body>

<div id="loginView" class="center">
  <div class="card">
    <h2>Controle Premium</h2>
    <button id="loginBtn">Entrar com Google</button>
  </div>
</div>

<div id="appView" style="display:none">
  <div class="topbar">
    <strong>Controle Premium</strong>
    <div id="userEmail"></div>
    <button id="logoutBtn" style="background:#ff4d4d">Sair</button>
  </div>

  <div class="tabs">
    <div class="tab">Finanças</div>
    <div class="tab">Metas</div>
    <div class="tab">Dashboard</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ssnabfzwfvcmwkgibvec.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzbmFiZnp3ZnZjbXdrZ2lidmVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwNTE1MjcsImV4cCI6MjA4NTYyNzUyN30.s02EFB4FRopxB7Ak7zWUSkINcGY5ESRn7SLbDXn0Wbo";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function restoreSession() {

  // 🔹 novo fluxo (?code=)
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get("code");

  if (code) {
    await supa.auth.exchangeCodeForSession(window.location.href);
    window.history.replaceState({}, document.title, window.location.pathname);
    return;
  }

  // 🔹 fluxo antigo (#access_token)
  if (window.location.hash.includes("access_token")) {
    await supa.auth.getSessionFromUrl({ storeSession: true });
    window.history.replaceState({}, document.title, window.location.pathname);
  }
}

function openApp(session){
  document.getElementById("loginView").style.display = "none";
  document.getElementById("appView").style.display = "block";
  document.getElementById("userEmail").innerText = session.user.email;
}

async function checkUser() {
  const { data } = await supa.auth.getSession();
  if (data.session) openApp(data.session);
}

document.getElementById("loginBtn").onclick = async () => {
  await supa.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.origin }
  });
};

document.getElementById("logoutBtn").onclick = async () => {
  await supa.auth.signOut();
  location.reload();
};

(async () => {
  await restoreSession();
  await checkUser();
})();

supa.auth.onAuthStateChange((_event, session) => {
  if(session) openApp(session);
});
</script>
</body>
</html>
