<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Premium</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#0b1225;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
button{
  padding:14px 22px;
  border-radius:8px;
  border:none;
  background:#00c2ff;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div>
  <h2>Controle Premium</h2>
  <button id="login">Entrar com Google</button>
  <p id="status">Não logado</p>
</div>

<script>
const SUPABASE_URL = "https://ssnabfzwfvcmwkgibvec.supabase.co";
const SUPABASE_ANON_KEY = "SUA_ANON_KEY_JA_EXISTENTE";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const statusEl = document.getElementById("status");
const btnLogin = document.getElementById("login");

// LOGIN GOOGLE
btnLogin.onclick = async () => {
  await supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.origin }
  });
};

// CAPTURA TOKEN DO GOOGLE
async function captureToken() {
  if (window.location.hash.includes("access_token")) {

    await supabase.auth.getSessionFromUrl({ storeSession: true });

    // limpa URL
    history.replaceState({}, document.title, window.location.pathname);

    location.reload();
  }
}

// VERIFICA LOGIN
async function checkUser(){
  const { data } = await supabase.auth.getSession();

  if(data.session){
    statusEl.innerText = "Logado: " + data.session.user.email;
  } else {
    statusEl.innerText = "Não logado";
  }
}

captureToken();
checkUser();

supabase.auth.onAuthStateChange(() => {
  checkUser();
});
</script>

</body>
</html>
