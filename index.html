<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Premium</title>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>

<style>
body{font-family:Arial, sans-serif;background:#0b1225;color:#fff;text-align:center;padding:40px}
button{padding:12px 22px;border-radius:8px;border:none;background:#22c55e;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<h2>Controle Premium</h2>
<button onclick="gerarPDF()">Gerar PDF Premium</button>

<script>
function gerarPDF(){

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

// linha superior
doc.setDrawColor(20,184,166);
doc.setLineWidth(1);
doc.line(14,15,80,15);

// título
doc.setFont("helvetica","bold");
doc.setFontSize(18);
doc.text("Relatório Financeiro",14,22);

// subtítulo
doc.setFontSize(10);
doc.setFont("helvetica","normal");
doc.text("Mês: 02/2026 • Controle Premium",14,29);

// data direita
doc.text("Gerado em: 27/02/2026 14:30",130,22);

// botão oval
doc.setDrawColor(20,184,166);
doc.setFillColor(236,253,252);
doc.roundedRect(150,25,40,10,5,5,"FD");
doc.setFontSize(9);
doc.text("Finanças",160,32);

// cards
function card(x,titulo,valor,cor){
  doc.setDrawColor(220);
  doc.setFillColor(255,255,255);
  doc.roundedRect(x,45,42,22,4,4,"FD");
  doc.setFillColor(...cor);
  doc.circle(x+36,50,2,"F");
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text(titulo,x+5,53);
  doc.setFont("helvetica","bold");
  doc.setFontSize(12);
  doc.setTextColor(20);
  doc.text(valor,x+5,61);
}

card(14,"Entradas","R$ 2.000,00",[34,197,94]);
card(60,"Saídas","R$ 100,00",[239,68,68]);
card(106,"Saldo","R$ 1.900,00",[34,197,94]);
card(152,"Registros","2",[59,130,246]);

// meta
doc.setFont("helvetica","bold");
doc.setFontSize(11);
doc.setTextColor(20);
doc.text("Meta do mês",14,85);

doc.setFontSize(9);
doc.setFont("helvetica","normal");
doc.text("Meta: R$ 3.000 • Entradas: R$ 2.000 • Falta: R$ 1.000 • Progresso: 66,7%",14,92);

// barra oval
doc.setFillColor(20,184,166);
doc.roundedRect(14,96,80,8,4,4,"F");

doc.setFontSize(8);
doc.text("66,7% da meta",38,108);

// visão rápida
doc.setFont("helvetica","bold");
doc.setFontSize(11);
doc.text("Visão rápida",110,85);

doc.setFontSize(9);
doc.setFont("helvetica","normal");
doc.text("Entradas vs Saídas (mês)",110,92);

doc.setFillColor(34,197,94);
doc.roundedRect(110,96,70,6,3,3,"F");

doc.setFillColor(239,68,68);
doc.circle(112,108,2,"F");
doc.text("Saídas",118,110);

// tabela
doc.setFont("helvetica","bold");
doc.setFontSize(11);
doc.text("Lançamentos do mês",14,125);

doc.autoTable({
 startY:130,
 head:[["Data","Tipo","Categoria","Descrição","Valor"]],
 body:[
   ["18/02/2026","Saída","Embalagem","teste","-R$ 100,00"],
   ["16/02/2026","Entrada","Vendas","Recebimento Amazon","R$ 2.000,00"]
 ],
 headStyles:{fillColor:[15,23,42]},
 styles:{fontSize:9}
});

doc.save("relatorio_financeiro_02_2026.pdf");
}
</script>
</body>
</html>
