<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Controle Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
<style>
body{
  font-family: Arial, sans-serif;
  background:#020617;
  color:#111;
}
button{
  padding:10px 16px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<h2>Controle Premium</h2>
<button onclick="gerarPDF()">Gerar PDF</button>

<script>
function gerarPDF(){

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  // LOGO + TÍTULO (centralizado)
  doc.setFont("helvetica","bold");
  doc.setFontSize(18);
  doc.text("💎 Controle Premium", 105, 20, { align: "center" });

  doc.setFontSize(10);
  doc.setFont("helvetica","normal");
  doc.text("Relatório Financeiro", 105, 26, { align: "center" });

  // linha separadora
  doc.setDrawColor(200);
  doc.line(20, 30, 190, 30);

  // KPIs exemplo
  doc.setFontSize(12);
  doc.text("Entradas: R$ 3.000,00", 20, 45);
  doc.text("Saídas: R$ 1.200,00", 20, 55);
  doc.text("Saldo: R$ 1.800,00", 20, 65);

  // tabela exemplo
  doc.autoTable({
    startY: 80,
    head: [["Data","Descrição","Categoria","Valor"]],
    body: [
      ["01/02/2026","Venda","Vendas","3000"],
      ["02/02/2026","Mercado","Despesa","-1200"]
    ],
    styles:{ halign:"center" },
    headStyles:{ fillColor:[0,0,0] }
  });

  doc.save("relatorio.pdf");
}
</script>

</body>
</html>
