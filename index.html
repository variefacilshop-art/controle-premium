<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Premium</title>
<style>
body{font-family:Arial;background:#0b1225;color:#fff;margin:0;padding:20px}
.toolbar{display:none;align-items:center;gap:15px;background:#111;padding:10px;border-radius:10px;margin-bottom:12px}
.item{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #333}
.chk{margin-right:6px}
.btnDel{background:#ef4444;border:none;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<h2>Movimentações</h2>

<div id="multiBar" class="toolbar">
  <span id="selCount">0 selecionados</span>
  <button class="btnDel" onclick="deleteSelected()">Excluir</button>
</div>

<div class="item" data-id="1">
  <input type="checkbox" class="chk" onchange="toggleSelect()">
  Venda Mercado Livre — R$ 120,00
</div>
<div class="item" data-id="2">
  <input type="checkbox" class="chk" onchange="toggleSelect()">
  Compra fornecedor — R$ -80,00
</div>

<script>
function toggleSelect(){
  const checked = document.querySelectorAll('.chk:checked').length;
  const bar = document.getElementById('multiBar');
  const count = document.getElementById('selCount');

  if(checked > 0){
    bar.style.display = 'flex';
    count.innerText = checked + " selecionados";
  } else {
    bar.style.display = 'none';
  }
}

function deleteSelected(){
  document.querySelectorAll('.chk:checked').forEach(cb => {
    cb.closest('.item').remove();
  });
  toggleSelect();
}
</script>

</body>
</html>
