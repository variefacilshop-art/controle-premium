<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;background:#0b1225;color:white">

<div id="login">
  <h2>Controle Premium</h2>
  <button onclick="login()" style="padding:12px 20px;font-size:16px">Entrar com Google</button>
</div>

<div id="app" style="display:none">
  <h2>Logado com sucesso ✅</h2>
  <button onclick="logout()">Sair</button>
</div>

<script>
const SUPABASE_URL = "https://ssnabfzwfvcmwkgibvec.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

async function login(){
  await supa.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.href }
  });
}

async function logout(){
  await supa.auth.signOut();
  location.reload();
}

async function check(){
  if(location.hash.includes("access_token")){
    await supa.auth.exchangeCodeForSession(window.location.href);
    history.replaceState({}, document.title, location.pathname);
  }

  const { data } = await supa.auth.getSession();

  if(data.session){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
  }
}

check();
</script>

</body>
</html>
