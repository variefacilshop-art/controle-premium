<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>PDF Premium Refinado</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<button onclick="gerarPDF()">Gerar PDF</button>
<script>
function gerarPDF(){
 const { jsPDF } = window.jspdf;
 const doc = new jsPDF();

 doc.setFont("helvetica","bold");
 doc.setFontSize(20);
 doc.text("Controle Premium",20,22);

 doc.setFont("helvetica","normal");
 doc.setFontSize(10);
 doc.text("Relatório (Finanças) • Mês: 02/2026",20,30);
 doc.text("Usuário: varie facilshop@gmail.com",20,36);

 doc.setDrawColor(200);
 doc.line(20,42,190,42);

 // KPIs mais elegantes
 doc.setFontSize(9);
 doc.setFont("helvetica","bold");
 doc.text("ENTRADAS",25,60);
 doc.text("SAÍDAS",85,60);
 doc.text("SALDO",140,60);

 doc.setFont("helvetica","normal");
 doc.setFontSize(12);
 doc.text("R$ 2.050,00",25,68);
 doc.text("R$ 100,00",85,68);
 doc.text("R$ 1.950,00",140,68);

 // gráfico pequeno fake
 doc.setDrawColor(180);
 doc.rect(20,80,170,30);
 doc.setFontSize(9);
 doc.text("Gráfico resumido",90,97,{align:"center"});

 doc.autoTable({
   startY:120,
   head:[["Data","Tipo","Categoria","Descrição","Valor"]],
   body:[
     ["18/02/2026","Entrada","Embalagem","teste","R$ 50,00"],
     ["18/02/2026","Saída","Embalagem","teste","-R$ 100,00"],
     ["16/02/2026","Entrada","Vendas","Amazon","R$ 2.000,00"]
   ],
   headStyles:{fillColor:[20,40,70],textColor:255},
   styles:{fontSize:10}
 });

 doc.save("relatorio.pdf");
}
</script>
</body>
</html>
