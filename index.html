<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Premium</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b1225;
  color:#fff;
}
.center{
  display:flex;
  height:100vh;
  align-items:center;
  justify-content:center;
}
.card{
  background:#111a33;
  padding:30px;
  border-radius:12px;
  width:320px;
  text-align:center;
}
button{
  padding:12px 18px;
  border:none;
  border-radius:8px;
  background:#00c2ff;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="loginView" class="center">
  <div class="card">
    <h2>Controle Premium</h2>
    <button id="loginBtn">Entrar com Google</button>
  </div>
</div>

<div id="appView" class="center" style="display:none">
  <div class="card">
    <h2>Logado com sucesso ✅</h2>
    <p id="userEmail"></p>
    <button id="logoutBtn" style="background:#ff4d4d">Sair</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ssnabfzwfvcmwkgibvec.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzbmFiZnp3ZnZjbXdrZ2lidmVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwNTE1MjcsImV4cCI6MjA4NTYyNzUyN30.s02EFB4FRopxB7Ak7zWUSkINcGY5ESRn7SLbDXn0Wbo";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function restoreSession() {
  if (window.location.hash.includes("access_token")) {
    await supa.auth.getSessionFromUrl({ storeSession: true });
    history.replaceState({}, document.title, window.location.pathname);
  }
}

async function checkUser() {
  const { data } = await supa.auth.getSession();
  if (data.session) {
    document.getElementById("loginView").style.display = "none";
    document.getElementById("appView").style.display = "flex";
    document.getElementById("userEmail").innerText = data.session.user.email;
  } else {
    document.getElementById("loginView").style.display = "flex";
    document.getElementById("appView").style.display = "none";
  }
}

document.getElementById("loginBtn").onclick = async () => {
  await supa.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.origin }
  });
};

document.getElementById("logoutBtn").onclick = async () => {
  await supa.auth.signOut();
  location.reload();
};

(async () => {
  await restoreSession();
  await checkUser();
})();

supa.auth.onAuthStateChange(() => {
  checkUser();
});
</script>

</body>
</html>
