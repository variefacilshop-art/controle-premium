<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Premium</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;margin:0;background:#0b1225;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#111a3a;padding:30px;border-radius:12px;text-align:center}
button{padding:12px 20px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<div class="box" id="loginBox">
  <h2>Controle Premium</h2>
  <p>Login com Google</p>
  <button onclick="login()">Entrar</button>
</div>

<div class="box" id="appBox" style="display:none">
  <h2>Bem-vindo</h2>
  <p id="userEmail"></p>
  <button onclick="logout()">Sair</button>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://ssnabfzwfvcmwkgibvec.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
);

// captura token após login
(async () => {
  if (window.location.hash.includes("access_token")) {
    await supabase.auth.getSessionFromUrl({ storeSession: true });
    window.location.hash = "";
  }

  const { data: { session } } = await supabase.auth.getSession();

  if(session){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("appBox").style.display="block";
    document.getElementById("userEmail").innerText=session.user.email;
  }
})();

async function login(){
  await supabase.auth.signInWithOAuth({
    provider:'google',
    options:{ redirectTo: window.location.origin }
  });
}

async function logout(){
  await supabase.auth.signOut();
  location.reload();
}
</script>
</body>
</html>
