<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Premium</title>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#0b1225;
  color:#fff;
  text-align:center;
  padding:40px;
}
button{
  padding:12px 22px;
  border-radius:8px;
  border:none;
  background:#22c55e;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>Controle Premium</h1>
<button onclick="gerarPDF()">Gerar PDF</button>

<script>
function gerarPDF(){

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

doc.setFont("helvetica","bold");
doc.setFontSize(18);
doc.text("Relatório Financeiro", 14, 20);

doc.setFontSize(11);
doc.setFont("helvetica","normal");
doc.text("Mês: 02/2026 • Controle Premium", 14, 28);
doc.text("Gerado em: 27/02/2026", 140, 28);

function card(x, titulo, valor){
  doc.setDrawColor(210);
  doc.roundedRect(x, 40, 45, 20, 3, 3);
  doc.setFontSize(9);
  doc.text(titulo, x+5, 48);
  doc.setFontSize(12);
  doc.setFont("helvetica","bold");
  doc.text(valor, x+5, 56);
}

card(14,"Entradas","R$ 2.000,00");
card(62,"Saídas","R$ 100,00");
card(110,"Saldo","R$ 1.900,00");
card(158,"Registros","2");

doc.setFontSize(11);
doc.setFont("helvetica","bold");
doc.text("Meta do mês",14,75);

doc.setFont("helvetica","normal");
doc.setFontSize(9);
doc.text("Meta: R$ 3.000 • Entradas: R$ 2.000 • Falta: R$ 1.000 • Progresso: 66,7%",14,82);

doc.setFillColor(20,184,166);
doc.roundedRect(14,86,120,6,3,3,"F");

doc.setFontSize(8);
doc.text("66,7% da meta",60,97);

doc.setFont("helvetica","bold");
doc.setFontSize(11);
doc.text("Lançamentos do mês",14,110);

doc.autoTable({
  startY:115,
  head:[["Data","Tipo","Categoria","Descrição","Valor"]],
  body:[
    ["18/02/2026","Saída","Embalagem","teste","-R$ 100,00"],
    ["16/02/2026","Entrada","Vendas","Recebimento Amazon","R$ 2.000,00"]
  ],
  headStyles:{fillColor:[15,23,42]},
  styles:{fontSize:9}
});

doc.save("relatorio_financeiro_02_2026.pdf");
}
</script>
</body>
</html>
